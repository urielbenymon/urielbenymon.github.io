          Abstract published in an abstract booklet and poster presented,
          Columbia University Undergraduate Research Symposium, 2026.

      - bullet: >-
          **Uriel Benymon.** Exploring Improvements to B-Tree Index
          Structures for Database Optimization. Poster presented,
          Columbia GS Research Festival, 2026. Abstract published in
          an abstract booklet and poster presented, Columbia University
          Undergraduate Research Symposium, 2025.

    Research Experience:
      - bullet: >-
          **Bancroft Research Scholar | Columbia University**
          (February 2026 – April 2026).
          Advisor: Professor Ansaf Salleb-Aouissi.

          - Developed a hypertension-prediction study using NHANES
            2017–March 2020 pre-pandemic data, conducting exploratory
            data analysis and building a preliminary multi-model ML pipeline.
          - Independently extended the project into a leakage-controlled,
            cross-validated study of 8,024 participants with five ML models,
            hyperparameter tuning, bootstrap inference, and SHAP-based
            interpretability.

      - bullet: >-
          **RISE Scholar | Columbia University**
          (April 2025 – July 2025).
          Advisor: Professor Paul Blaer.

          - Benchmarked PostgreSQL's B-Tree index against other index
            types (Hash, BRIN, etc.) using a custom Java/SQL environment
            across randomized, standardized workloads.
          - Began testing lightweight B-Tree modifications
            (node capacity/configuration changes) under concurrent
            operations to explore performance trade-offs.

    Independent Research Projects:
      - bullet: |-
          **Project Lead | System-Prompt Invariance for LLM-as-Judge Study**
          (January 2026 – August 2026).

          - Led a five-person research team originating from a Columbia
            University LLM course project. Designed linguistic perturbation
            experiments and developed a Python evaluation pipeline comprising
            324 judgments across three LLM graders, 108 model responses,
            and four response-generating models.
          - Recruited blinded volunteer human raters to validate evaluation
            outcomes, obtaining Krippendorff's alpha of approximately 0.93
            and 98% exact agreement with automated scores. Grader format
            compliance ranged from approximately 57% to 100%.

